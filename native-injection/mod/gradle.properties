# ============================================================================
#  Версии для сборки мода. Все они собраны в одном месте, чтобы обновление
#  Minecraft не превращалось в правку по всему проекту.
#
#  Целевая версия — Minecraft 1.20.1 (LTS-подобная, максимум модов и Fabric API).
#  Если вы играете на другой версии — поменяйте четыре строки ниже
#  (проверить актуальные значения: https://fabricmc.net/develop/).
# ============================================================================
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.15.11
fabric_version=0.92.2+1.20.1

mod_version=1.0.0
maven_group=dev.gwyfbridge
archives_base_name=gwyfbridge
