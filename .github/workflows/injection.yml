# ============================================================================
#  injection.yml — проверка инъекционного моста «оригинальная GWYF ↔ Minecraft».
#
#  Этот конвейер относится к каталогу native-injection/ — модулю, который по
#  заданию работает с ОРИГИНАЛЬНОЙ игрой: DLL внедряется в её процесс, хуки
#  ставятся на отправку ставки и генерацию стола, а мир Minecraft синхронизируется
#  с игрой в обе стороны. Второй нативный каталог (native/) — отдельный мост для
#  нашего собственного приложения, у него свой конвейер (native-bridge.yml).
#
#  Что делается и зачем:
#    * windows — сборка MSVC (той же, что у пользователя в Visual Studio),
#      линковка GWYF_HookEngine.dll / gwyf_native_bridge.dll / gwyfbridge.exe и
#      полный самотест, включая интеграционный прогон движка внутри
#      синтетического хоста с поддельным Mono;
#    * linux-portable — переносимое ядро: ABI, SPSC-кольца, зеркало вокселей,
#      профиль игры; сверка хеша раскладки с Java-константой и контракта JNI по
#      заголовку, который генерирует javac;
#    * fabric-mod — best-effort сборка мода (Loom тянет Minecraft и маппинги из
#      сети, поэтому сбой этого задания не блокирует остальные проверки).
#
#  Журналы GitHub Actions лежат в Azure и из песочницы недоступны, поэтому все
#  шаги пишут вывод в /tmp/*.log, а шаг диагностики выкладывает хвосты в
#  аннотации проверки (см. .github/scripts/ci-diagnostics.sh).
# ============================================================================
name: injection

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'native-injection/**'
      - '.github/workflows/injection.yml'
  pull_request:
    paths:
      - 'native-injection/**'
      - '.github/workflows/injection.yml'
  workflow_dispatch:

jobs:
  windows:
    name: Windows (MSVC + MinHook) — сборка, DLL и самотест
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Установить JDK (нужен для gwyf_native_bridge.dll)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Генератор не пиним: у GitHub раннеры с Visual Studio 17 и 18, и жёсткое
      # «-G "Visual Studio 17 2022"» падает с «could not find any instance of
      # Visual Studio». Без -G CMake берёт новейший установленный.
      - name: Настроить CMake (Visual Studio, x64)
        shell: bash
        run: |
          cmake -S native-injection -B native-injection/build 2>&1 | tee /tmp/cmake.log

      - name: Собрать Release
        shell: bash
        run: |
          cmake --build native-injection/build --config Release --parallel 2>&1 | tee /tmp/build.log

      - name: Самотест (включая интеграцию с поддельным Mono)
        shell: bash
        run: |
          ctest --test-dir native-injection/build -C Release --output-on-failure 2>&1 | tee /tmp/ctest.log

      # ctest складывает вывод всех тестов в один файл, поэтому при аварийном
      # завершении процесса хвост журнала не показывает место сбоя. Повторяем
      # прогон напрямую — по журналу на тест, чей хвост читает диагностика.
      - name: Повторить тесты напрямую (журнал на каждый тест)
        if: failure()
        shell: bash
        run: |
          cd native-injection/build/Release || exit 0
          ./gwyfbridge_selftest.exe --portable 2>&1 | tee /tmp/selftest-portable.log || true
          ./gwyfbridge_selftest.exe 2>&1 | tee /tmp/selftest-all.log || true
          ./gwyfbridge_selftest.exe --integration ./GWYF_HookEngine.dll 2>&1 | tee /tmp/selftest-integration.log || true

      - name: Проверить, что артефакты на месте
        shell: pwsh
        run: |
          $required = @(
            "native-injection/build/Release/GWYF_HookEngine.dll",
            "native-injection/build/Release/gwyf_native_bridge.dll",
            "native-injection/build/Release/gwyfbridge.exe",
            "native-injection/build/Release/gwyfbridge_selftest.exe",
            "native-injection/build/Release/fake_mono_host.dll"
          )
          $missing = @()
          foreach ($file in $required) {
            if (Test-Path $file) { Write-Host "есть: $file" }
            else { $missing += $file }
          }
          if ($missing.Count -gt 0) {
            Write-Error ("не собраны артефакты: " + ($missing -join ", "))
          }

      - name: Диагностика при сбое
        if: failure()
        shell: bash
        run: bash .github/scripts/ci-diagnostics.sh

      - name: Загрузить артефакты сборки
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gwyfbridge-native-win64
          path: |
            native-injection/build/Release/GWYF_HookEngine.dll
            native-injection/build/Release/gwyf_native_bridge.dll
            native-injection/build/Release/gwyfbridge.exe
            native-injection/build/Release/gwyfbridge_selftest.exe
            native-injection/build/Release/fake_mono_host.dll

  linux-portable:
    name: Linux — переносимое ядро, контракт JNI и раскладка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Собрать переносимую часть
        run: |
          cmake -S native-injection -B native-injection/build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee /tmp/cmake.log
          cmake --build native-injection/build --parallel 2>&1 | tee /tmp/build.log

      # libstdc++ подтягивает заголовки транзитивно, MSVC — нет: именно так CI
      # ловил std::transform без <algorithm>. Проверяем до сборки на Windows.
      - name: Проверить, что все средства std::* подключены явно (MSVC не прощает)
        run: python3 native-injection/tools/check_includes.py 2>&1 | tee /tmp/includes.log

      - name: Прогнать самотест (ABI, кольца, воксели, профиль)
        run: ctest --test-dir native-injection/build --output-on-failure 2>&1 | tee /tmp/ctest.log

      # Стек главного потока в Windows — 1 МБ (в Linux — 8 МБ), поэтому тест с
      # крупным локальным объектом падает только на MSVC: именно так CI получил
      # 0xC00000FD в первом же тесте и без единой подсказки о месте сбоя.
      # Повторяем здесь то же ограничение — регрессию поймает Linux-задача.
      - name: Самотест при стеке 1 МБ (как на Windows — ловит крупные кадры)
        run: |
          ulimit -s 1024
          native-injection/build/gwyfbridge_selftest --portable 2>&1 | tee /tmp/stack.log

      - name: Сверить хеш раскладки данных с Java-константой
        run: |
          HASH=$(native-injection/build/gwyfbridge_selftest --print-layout-hash)
          echo "хеш раскладки: $HASH" | tee /tmp/wire.log
          python3 native-injection/tools/check_wire_contract.py "$HASH" 2>&1 | tee -a /tmp/wire.log

      - name: Скомпилировать Java-часть моста и сгенерировать JNI-заголовок
        run: |
          mkdir -p build/jni
          javac -h build/jni -d build/classes \
            native-injection/mod/src/main/java/dev/gwyfbridge/mc/BridgeNative.java \
            native-injection/mod/src/main/java/dev/gwyfbridge/mc/BridgeRecords.java 2>&1 | tee /tmp/javac.log

      - name: Сверить объявления JNI в Java и реализацию в C++
        run: |
          python3 native-injection/tools/check_jni_contract.py \
            build/jni/dev_gwyfbridge_mc_BridgeNative.h \
            native-injection/src/Native_JNI_Bridge.cpp 2>&1 | tee /tmp/jni.log

      - name: Диагностика при сбое
        if: failure()
        run: bash .github/scripts/ci-diagnostics.sh

  fabric-mod:
    name: "Fabric-мод (best effort: Loom тянет Minecraft из сети)"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Собрать мод
        working-directory: native-injection/mod
        run: gradle build --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Загрузить jar мода
        uses: actions/upload-artifact@v4
        with:
          name: gwyfbridge-fabric-mod
          path: native-injection/mod/build/libs/*.jar
          if-no-files-found: warn
